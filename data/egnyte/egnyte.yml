markdown: >-
  ## Overview


  Egnyte is a middle-of-the-road solution bridging cloud storage and full
  document management software. It includes strong collaboration and workflow
  features with a focus on security and governance.


  ## Features


  - Strong security and data governance features

  - Ransomware detection and recovery

  - Built-in compliance

  - Strict data retention policies

  - Collaboration and workflow features

  - Single document AI capabilities


  ## Pricing


  Starts at $22/user/month for the Business plan, which includes basic features
  and single document AI.


  ## Deployment


  Cloud-based platform.
