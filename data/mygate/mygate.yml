markdown: >-
  ## Overview


  Mygate serves as a secure digital repository for society documents, including
  invoices, audit reports, NOCs, circulars, and agreements. Files are tagged,
  version-controlled, and accessible based on admin permissions, making audits
  and handovers effortless.


  ## Key Features


  - Document repository with tagging and version control

  - Admin permission-based access control

  - Parking management

  - Payment gateways and online payments

  - Accounting management

  - Invoices

  - Help desk

  - Child security

  - SMS notifications

  - Visitor management

  - Maintenance communication

  - Resident request tracking


  ## Deployment


  Suitable for StartUps, SMBs, Mid-Market, and Enterprises.


