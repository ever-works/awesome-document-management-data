markdown: >-
  ## Overview


  Dropbox Business is a cloud storage service that also serves as a lightweight
  document management solution. It offers versioning for collaboration,
  eSignature, and audit logs as document management features.


  ## Features


  - User-friendly interface

  - Seamless integration with popular office suites

  - Secure file storage and sharing

  - Link expiration

  - Versioning for collaboration

  - eSignature

  - Audit logs

  - Zapier integration for workflow automation


  ## Pricing


  - Free plan available for personal use

  - Business plans start at $16.58/month (annual billing) for a single user

  - $15/user/mo for 3+ users


  ## Deployment


  Cloud-based platform.
