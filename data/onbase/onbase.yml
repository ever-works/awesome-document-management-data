markdown: >-
  ## Overview


  Hyland OnBase is an enterprise content management (ECM) platform for managing
  documents, records, and business processes at scale.


  ## Features


  - Document imaging and capture

  - Records management and retention

  - Workflow and business process automation

  - Case management

  - Full-text search and retrieval

  - Role-based access control

  - Integrations with ERP, CRM, and line-of-business systems


  ## Deployment


  Available as on-premise and cloud-hosted deployment options.


  ## Pricing


  Commercial, enterprise-grade software with pricing based on deployment scope
  and user count.
