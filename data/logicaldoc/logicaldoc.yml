markdown: >-
  ## Overview


  LogicalDOC is a document management system (DMS) for managing, indexing, and
  sharing business documents. It is offered in both a free community edition and
  commercial editions.


  ## Features


  - Full-text search across documents

  - Version control and document history

  - Workflow automation

  - Role-based access control and permissions

  - Document indexing and metadata management

  - Multi-language support

  - Web-based user interface


  ## Deployment


  Self-hosted; available as a community edition and commercial editions.


  ## Pricing


  Community edition is open source (GNU LGPL); commercial editions are paid with
  licensing based on deployment scale.


  ## Repository


  Source code available on GitHub: https://github.com/logicaldoc
