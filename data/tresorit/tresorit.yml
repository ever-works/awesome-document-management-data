markdown: >-
  ## Overview


  Tresorit is a secure cloud storage solution known for its end-to-end
  encryption, ensuring data privacy. It offers seamless file sharing,
  collaboration tools, and cross-platform accessibility.


  ## Key Features


  - End-to-end encryption

  - Granular permissions

  - File versioning

  - Two factor authentication

  - Integration with apps

  - Access control

  - Mobile access

  - File synchronization

  - Activity tracking


  ## Pricing Model


  Paid subscription. Personal plan starts at $12 per user per month. Business
  Standard plan starts at $19 per user per month.


  ## Deployment


  Cloud-hosted.
