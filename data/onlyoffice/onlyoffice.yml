markdown: >-
  ## Overview


  ONLYOFFICE is an open-source office suite and document collaboration platform
  offering online document editors, version control, sharing, and access
  management.


  ## Features


  - Document, spreadsheet, and presentation editors

  - Real-time co-authoring and collaboration

  - Version control and document history

  - Access control and sharing permissions

  - Comments, chat, and review modes

  - Form creation and filling

  - Integration with Nextcloud, ownCloud, SharePoint, and other DMS/ECM
  platforms


  ## Deployment


  Available as self-hosted (Community Edition, GNU AGPL) and cloud (SaaS)
  editions.


  ## Pricing


  Community Edition is free and open source (GNU AGPL); commercial editions and
  SaaS subscriptions are paid.


  ## Repository


  Source code available on GitHub: https://github.com/ONLYOFFICE
