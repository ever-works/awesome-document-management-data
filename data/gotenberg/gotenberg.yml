markdown: >-
  ## Overview


  Gotenberg is a developer-friendly API to interact with powerful tools like
  Chromium and LibreOffice for converting numerous document formats (HTML,
  Markdown, Word, Excel, etc.) into PDF files and more.


  ## Features


  - Document format conversion

  - HTML to PDF

  - Markdown to PDF

  - Word to PDF

  - Excel to PDF

  - Chromium integration

  - LibreOffice integration


  ## Deployment


  Self-hosted via Docker


  ## License


  MIT


  ## Repository


  https://github.com/gotenberg/gotenberg
