markdown: >-
  ## Overview


  Square 9 provides a range of document management solutions for different
  business needs. Its GlobalAction workflow automation lets you map document
  activities from data capture to archiving, with workflows for extracting
  information from external and internal documents.


  ## Features


  - GlobalAction workflow automation

  - Sharp OCR for scanning large volumes of documents

  - Intuitive and fast search functionality

  - Workflow creation for data extraction from internal and external documents

  - Document routing throughout the organization

  - Disposal and retention management for confidential information

  - Document capture tool for high-volume documents including emails and
  attachments


  ## Pricing


  From $50/user/month (minimum 5 users)


  ## Deployment


  Cloud-based platform.
