markdown: >-
  ## Overview


  PandaDoc is an all-in-one document management solution for small businesses.
  It combines basic file management with contract management and eSigning,
  allowing users to create contracts, quotes, proposals, and forms from scratch
  or using templates.


  ## Features


  - User-friendly interface

  - Extensive template library (1,000+ templates) for document generation

  - Contract management

  - eSigning capabilities

  - Real-time document sharing and review

  - Client view/click/download notifications

  - Zapier integration for workflow automation


  ## Pricing


  - Free plan available

  - Paid plans start at $35/user/month


  ## Deployment


  Cloud-based platform.
