markdown: >-
  ## Overview


  Bitrix24 is an all-in-one platform that includes document management software
  alongside CRM and collaboration tools.


  ## Features


  - Email Marketing

  - Mobile CRM

  - Document Management

  - Workflow Automation

  - Sales Automation

  - Telephony Integration

  - Task Management

  - Reporting And Analytics

  - File sharing

  - Version tracking


  ## Pricing


  - **Free**: $0 per user/month

  - **Plus**: $39 per month for unlimited users

  - **Standard**: $99 per month for unlimited users

  - **Professional**: $199 per month for unlimited users


  ## Deployment


  Cloud-based
