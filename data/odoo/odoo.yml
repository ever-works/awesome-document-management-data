name: Odoo
description: Odoo is an open-source suite of business applications that includes
  document management as part of its broader ERP and CRM platform. It provides
  file storage, document linking to business records, access control, and
  versioning, available in both community (open source) and enterprise editions
  with self-hosted and cloud deployment options.
