markdown: >-
  ## Overview


  Odoo is an open-source suite of business applications (ERP, CRM, e-commerce,
  and more) that includes document management capabilities integrated with
  business records and processes.


  ## Features


  - Document storage and attachment to business records (invoices, projects,
  contacts, etc.)

  - Version control and access permissions

  - Folder structure and tagging

  - Integration with Odoo CRM, ERP, invoicing, project, and website modules

  - Web-based interface

  - Multi-company support

  - Mobile access


  ## Deployment


  Available as self-hosted (Community Edition, GNU LGPL) and cloud-hosted (Odoo
  Online, SaaS).


  ## Pricing


  Community Edition is free and open source (GNU LGPL); Enterprise Edition and
  SaaS hosting are paid.


  ## Repository


  Source code available on GitHub: https://github.com/odoo/odoo
